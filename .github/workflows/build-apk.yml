name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner already ships the Android SDK. Just accept licenses and make sure SDK 34 is there.
      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # Installs Gradle 8.7 itself, so no gradle-wrapper.jar is needed in the repo
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      # Version comes from app/build.gradle.kts (versionName). Bump it, push to main, and a release appears.
      - name: Read version
        id: ver
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "GraphicarrayVoiceTyper-v${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GraphicarrayVoiceTyper-apk
          path: GraphicarrayVoiceTyper-v${{ steps.ver.outputs.name }}.apk

      # Every push to main (and every v* tag) publishes a release named after the build version.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.name) }}
          name: Ai Voice Typer v${{ steps.ver.outputs.name }}
          body: |
            Version ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})
            Commit: ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: GraphicarrayVoiceTyper-v${{ steps.ver.outputs.name }}.apk
