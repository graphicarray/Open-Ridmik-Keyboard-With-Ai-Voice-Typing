name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner already ships the Android SDK. Just accept licenses and make sure SDK 34 is there.
      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # Installs Gradle 8.7 itself, so no gradle-wrapper.jar is needed in the repo
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GraphicarrayVoiceTyper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GraphicarrayVoiceTyper-apk
          path: GraphicarrayVoiceTyper.apk

      # Tag a version (e.g. v1.0) to publish the APK as a GitHub Release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GraphicarrayVoiceTyper.apk
